<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LO Scorekaart</title>
<meta name="description" content="Beoordeel leerlingen per LO-oefening op criteria en bewaar de scores.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LO Score">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: native iOS feel — large title + blurred nav bar, inset grouped lists, floating score bar above a tab bar, bottom sheets. */
:root{
  --bg:#f2f2f7; --card:#ffffff; --sheet:#f2f2f7; --sheet-card:#ffffff;
  --fill:rgba(118,118,128,.12); --ink:#000000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.32); --sep:rgba(60,60,67,.2);
  --tint:#007aff; --tint-ink:#ffffff; --bar:rgba(249,249,249,.86);
  --l0:#28b14c; --l1:#00b3aa; --l2:#f08c00; --l3:#ff3b30;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-d:-apple-system-headline,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --tabh:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e; --sheet-card:#2c2c2e;
  --fill:rgba(118,118,128,.24); --ink:#ffffff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#0a84ff; --tint-ink:#ffffff; --bar:rgba(22,22,24,.82);
  --l0:#30d158; --l1:#40d9d0; --l2:#ff9f0a; --l3:#ff453a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --sheet:#1c1c1e; --sheet-card:#2c2c2e;
  --fill:rgba(118,118,128,.24); --ink:#ffffff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#0a84ff; --tint-ink:#ffffff; --bar:rgba(22,22,24,.82);
  --l0:#30d158; --l1:#40d9d0; --l2:#ff9f0a; --l3:#ff453a; color-scheme:dark}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--ink);font:17px/1.3 var(--font);letter-spacing:-.01em;padding-inline:16px;padding-block:0 calc(var(--tabh) + 104px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:none;padding:0;text-align:inherit}
:focus-visible{outline:2.5px solid var(--tint);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:620px;margin:0 auto}
.view{display:flex;flex-direction:column}

/* nav bar */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin-inline:-16px;padding-inline:16px;transition:background .2s,box-shadow .2s}
.nav.solid{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{max-width:620px;margin:0 auto;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.nav-t{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.nav.solid .nav-t{opacity:1}
.nav-b{color:var(--tint);font-size:17px;min-height:44px;display:flex;align-items:center;gap:4px}
.nav-b.r{justify-self:end;font-weight:600}
.nav-b[hidden]{display:flex!important;visibility:hidden}
.large{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:.012em;line-height:1.15;margin:2px 0 6px;text-wrap:balance}
.sub{color:var(--ink2);font-size:15px;margin:-2px 0 4px;display:flex;align-items:center;gap:6px}
.sub i{width:7px;height:7px;border-radius:50%;background:var(--l0)}
.sub.local i{background:var(--l2)}

/* grouped lists */
.gh{font-size:13px;color:var(--ink2);text-transform:uppercase;letter-spacing:.02em;padding:22px 16px 7px;display:flex;justify-content:space-between;gap:8px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 52px)}
.gh b{font-weight:400;color:var(--ink2)}
.gf{font-size:13px;color:var(--ink2);padding:7px 16px 0;line-height:1.35}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;min-height:46px;padding:11px 16px;width:100%}
.cell+.cell::before,.cell+.sugg::before,.sugg+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.ind+.cell::before{left:52px}
button.cell:active{background:var(--fill)}
.cell-l{width:64px;flex:none}
.cell input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:17px;padding:0}
.cell input::placeholder{color:var(--ink3)}
.chev{width:8px;height:13px;color:var(--ink3);flex:none}
.val{color:var(--ink2);margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.tintc{color:var(--tint)}
.dangerc{color:var(--l3)}
.center{justify-content:center}

/* suggestions */
.sugg{position:relative;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;background:var(--fill);border-radius:999px;padding:7px 13px;font-size:15px}
.notice{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--ink)}
.notice svg{color:var(--l2);flex:none;margin-top:1px}

/* criteria options */
.opt{--c:var(--l0)}
.opt[data-l="1"]{--c:var(--l1)}.opt[data-l="2"]{--c:var(--l2)}.opt[data-l="3"]{--c:var(--l3)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none;margin-inline:6px 2px}
.opt-b{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-block:2px}
.opt-n{font-weight:600;font-size:16px}
.opt-d{font-size:14px;color:var(--ink2);line-height:1.3}
.opt-p{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chk{width:20px;height:20px;flex:none;color:var(--tint);opacity:0}
.opt[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 13%,var(--card))}
.opt[aria-pressed="true"] .chk{opacity:1;color:var(--c)}
.opt[aria-pressed="true"] .opt-p{color:var(--ink);font-weight:600}
.got{font-variant-numeric:tabular-nums;text-transform:none;font-size:13px}
.got.ok{color:var(--ink);font-weight:600}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px}
.seg-o{--c:var(--l0);border-radius:10px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--fill);min-height:58px;justify-content:center;transition:transform .08s}
.seg-o:active{transform:scale(.96)}
.seg-o[data-l="1"]{--c:var(--l1)}.seg-o[data-l="2"]{--c:var(--l2)}.seg-o[data-l="3"]{--c:var(--l3)}
.seg-o .n{font-size:12px;font-weight:600;letter-spacing:-.02em}
.seg-o .p{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.seg-o[aria-pressed="true"]{background:var(--c);color:#fff}

/* segmented control */
.segctl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;margin-top:8px}
.segctl button{border-radius:7px;padding:6px 8px;font-size:14px;font-weight:500;text-align:center}
.segctl button[aria-pressed="true"]{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

/* score bar */
.scorebar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));padding:8px 12px;z-index:30;pointer-events:none}
.scorebar .in{pointer-events:auto;max-width:620px;margin:0 auto;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:22px;padding:8px 8px 8px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.16),0 0 0 .5px var(--sep)}
.ring{width:46px;height:46px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .bgc{stroke:var(--fill)}
.ring .fg{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .3s,stroke .3s}
.score-t{flex:1;min-width:0}
.score-big{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score-big small{font-size:15px;color:var(--ink2);font-weight:500}
.score-sub{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{border-radius:14px;padding:13px 20px;font-weight:600;font-size:17px;background:var(--tint);color:var(--tint-ink);text-align:center;transition:opacity .15s,transform .08s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35}
.btn.wide{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.plain{background:var(--card);color:var(--tint)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--ink2);text-align:center}
.tab svg{width:27px;height:27px}
.tab[aria-current="page"]{color:var(--tint)}

/* results */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stat{padding:12px 14px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.stat b{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink2)}
.row-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-s{font-size:14px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars{display:flex;gap:3px;margin-top:4px}
.bars i{height:4px;width:22px;border-radius:2px;background:var(--fill)}
.bars i[data-l="0"]{background:var(--l0)}.bars i[data-l="1"]{background:var(--l1)}.bars i[data-l="2"]{background:var(--l2)}.bars i[data-l="3"]{background:var(--l3)}
.badge{font-variant-numeric:tabular-nums;font-weight:600;font-size:16px;white-space:nowrap;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--l0)) 16%,transparent);color:var(--ink)}
.badge small{font-weight:400;color:var(--ink2);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.tag{font-size:12.5px;background:var(--fill);border-radius:6px;padding:2px 7px;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tag b{color:var(--ink);font-weight:600}
.icon-c{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:#fff;background:var(--tint)}
.icon-c svg{width:18px;height:18px}

.empty{text-align:center;padding:36px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h2{font-size:20px;margin:0}
.empty p{color:var(--ink2);margin:0;font-size:15px;max-width:30ch}

/* editor */
.ed-lv{display:flex;flex-direction:column;gap:6px;padding:11px 16px;position:relative}
.ed-lv::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.ed-top{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.ed-top .dot{margin:0}
.ed-top input{margin-left:auto;width:64px;text-align:right;border:none;background:var(--fill);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums;outline:none}
.ed-lv textarea{border:none;background:none;outline:none;resize:none;font-size:15px;color:var(--ink);padding:0;min-height:22px;line-height:1.35}
.ed-lv textarea::placeholder,.ed-top input::placeholder{color:var(--ink3)}

/* sheet */
.sheet-bd{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:60;opacity:0;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--sheet);border-radius:14px 14px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet .wrap{display:flex;flex-direction:column}
.sheet .group{background:var(--sheet-card)}
.sheet.open{transform:none}.sheet-bd.open{opacity:1}
.grab{width:36px;height:5px;border-radius:3px;background:var(--ink3);margin:0 auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:4px 4px 8px}
.sheet-h h2{margin:0;font-size:22px;font-weight:700}
.sheet-h p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.det-r{display:flex;justify-content:space-between;gap:12px}
.det-r .lv{font-size:14px;color:var(--ink2)}
.json-out{width:100%;height:180px;border:none;background:var(--sheet-card);border-radius:12px;padding:12px;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--ink)}
.gap{height:12px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);transform:translate(-50%,-160%);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:600;font-size:15px;z-index:80;transition:transform .3s cubic-bezier(.2,.9,.25,1);max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.18),0 0 0 .5px var(--sep);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;margin-left:-280px;border-radius:14px;bottom:24px}}
</style>

<header class="nav" id="nav"><div class="nav-in">
  <button class="nav-b" id="navL" hidden></button>
  <div class="nav-t" id="navT">Beoordelen</div>
  <button class="nav-b r" id="navR" hidden></button>
</div></header>

<main class="wrap">
  <h1 class="large" id="large">Beoordelen</h1>
  <div class="sub local" id="sync"><i></i><span>Laden…</span></div>
  <section id="v-eval" class="view"></section>
  <section id="v-res" class="view" hidden></section>
  <section id="v-ex" class="view" hidden></section>
</main>

<div class="scorebar" id="scorebar"><div class="in">
  <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle class="bgc" cx="23" cy="23" r="19"/><circle class="fg" id="ringfg" cx="23" cy="23" r="19" stroke-dasharray="119.38" stroke-dashoffset="119.38"/></svg>
  <div class="score-t"><div class="score-big" id="scoreBig">0 <small>/ 0</small></div><div class="score-sub" id="scoreSub">Kies een oefening</div></div>
  <button class="btn" id="saveBtn" disabled>Opslaan</button>
</div></div>

<nav class="tabbar" aria-label="Navigatie"><div class="in">
  <button class="tab" data-tab="eval" aria-current="page">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="18" height="21" rx="3.5"/><path d="M10 4.5V3h8v1.5"/><path d="m9.5 15 3 3 6-6.5"/></svg>Beoordelen</button>
  <button class="tab" data-tab="res">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 23V14M12 23V6M18 23v-6M24 23V10"/></svg>Resultaten</button>
  <button class="tab" data-tab="ex">
    <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="5.5" r="2.3"/><path d="M14 8.5v7l-4.5 8M14 15.5l4.5 8M7 11.5h14"/></svg>Oefeningen</button>
</div></nav>

<div class="sheet-bd" id="sheetBd" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="grab"></div><div class="wrap" id="sheetC"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="vendor/jspdf.umd.min.js" defer></script>
<script>
(() => {
const LEVELS = ["Uitstekend","Goed","Voldoende","Onvoldoende"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => (Math.round((+n||0)*100)/100).toLocaleString("nl-BE",{maximumFractionDigits:2});
const slug = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "x";
const ls = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}} };
const pad2 = n => String(n).padStart(2,"0");
const stamp = (d=new Date()) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}_${pad2(d.getHours())}-${pad2(d.getMinutes())}-${pad2(d.getSeconds())}`;
const lvlColor = p => p>=.8?"var(--l0)":p>=.65?"var(--l1)":p>=.5?"var(--l2)":"var(--l3)";
const CHEV = `<svg class="chev" viewBox="0 0 8 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m1.5 1.5 5 5-5 5"/></svg>`;
const CHECK = `<svg class="chk" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10.5 4 4 8-9"/></svg>`;
const ICON_DOC = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7z"/><path d="M11.5 2.5V7H16M10 10v5M7.5 12.5 10 15l2.5-2.5"/></svg>`;

/* ---------- store: shared db when available, otherwise this device ---------- */
const S = { exercises:{}, students:{}, scores:{} };
let db = null, mode = "loading", downloads = null;
const STARTER = {"koprol-voorwaarts": {"name": "Koprol voorwaarts", "createdAt": "2026-10-12T12:00:00.000Z", "criteria": [{"id": "c1", "name": "Startpositie", "levels": [{"points": 2, "desc": "Start gehurkt, voeten samen, armen voorwaarts gestrekt"}, {"points": 1.5, "desc": "Startpositie bijna volledig correct"}, {"points": 1, "desc": "Meerdere aandachtspunten"}, {"points": 0, "desc": "Startpositie niet correct"}]}, {"id": "c2", "name": "Handplaatsing", "levels": [{"points": 2, "desc": "Plaatst beide handen op schouderbreedte, vingers wijzen voorwaarts"}, {"points": 1.5, "desc": "Handen bijna correct geplaatst"}, {"points": 1, "desc": "Handen staan niet optimaal"}, {"points": 0, "desc": "Plaatst handen verkeerd of niet op de mat"}]}, {"id": "c3", "name": "Uitvoering van de rol", "levels": [{"points": 2, "desc": "Kin op de borst, hoofd ingetrokken, rolt over de schouders en bovenrug"}, {"points": 1.5, "desc": "Uitvoering grotendeels correct"}, {"points": 1, "desc": "Rolt onzeker of maakt onvoldoende bol"}, {"points": 0, "desc": "Rolt niet veilig of correct"}]}, {"id": "c4", "name": "Opkomen uit de rol", "levels": [{"points": 2, "desc": "Houdt knieën en voeten samen en brengt de hielen naar het zitvlak"}, {"points": 1.5, "desc": "Komt bijna zelfstandig en gecontroleerd recht"}, {"points": 1, "desc": "Heeft moeite om recht te komen"}, {"points": 0, "desc": "Kan niet zelfstandig rechtkomen"}]}, {"id": "c5", "name": "Eindpositie en controle", "levels": [{"points": 2, "desc": "Komt gecontroleerd in hurkzit, voeten samen, zonder handensteun"}, {"points": 1.5, "desc": "Komt recht met een klein evenwichtsverlies"}, {"points": 1, "desc": "Heeft extra handensteun nodig"}, {"points": 0, "desc": "Kan niet zelfstandig tot hurkzit komen"}]}]}};
function loadLocal(){ const d = ls.get("lo-db", null); if (d) { for (const k of Object.keys(S)) S[k] = d[k] || {}; } else { S.exercises = JSON.parse(JSON.stringify(STARTER)); saveLocal(); } }
function saveLocal(){ ls.set("lo-db", S); }
async function put(col, id, obj){ if (db) await db.collection(col).doc(id).set(obj); S[col][id] = obj; if (!db) saveLocal(); render(); }
async function del(col, id){ if (db) await db.collection(col).doc(id).delete(); delete S[col][id]; if (!db) saveLocal(); render(); }
async function initStore(){
  try { await navigator.storage?.persist?.(); } catch {}
  if (db) {
    mode = "cloud";
    for (const col of Object.keys(S)) db.collection(col).onSnapshot(snap => {
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S[col] = m; render();
    }, () => {});
  } else { mode = "local"; loadLocal(); }
  render();
}

/* ---------- ui state ---------- */
const U = { tab:"eval", exId:ls.get("lo-ex",null), name:"", klas:ls.get("lo-klas",""), choices:{}, compact:ls.get("lo-compact",false),
  resEx:null, resMode:"ex", resSort:"name", editing:null };
const exList = () => Object.entries(S.exercises).map(([id,e]) => ({id,...e})).sort((a,b)=>(a.createdAt||"").localeCompare(b.createdAt||"") || a.name.localeCompare(b.name));
const curEx = () => { const l = exList(); const e = l.find(x=>x.id===U.exId) || l[0] || null; if (e) U.exId = e.id; return e; };
const critMax = c => Math.max(...c.levels.map(l=>+l.points||0));
const maxOf = ex => ex.criteria.reduce((s,c)=>s+critMax(c),0);
const findStudent = name => { const n = name.trim().toLowerCase(); return n ? Object.entries(S.students).find(([,s]) => s.name.trim().toLowerCase() === n) : null; };
const scoreId = (sid, eid) => sid + "__" + eid;
const scoreList = () => Object.entries(S.scores).map(([id,s])=>({id,...s}));

/* ---------- chrome ---------- */
function setNav(title, left, right){
  $("#large").textContent = title; $("#navT").textContent = title;
  for (const [el,cfg] of [[$("#navL"),left],[$("#navR"),right]]) {
    el.hidden = !cfg; if (!cfg) continue; el.innerHTML = cfg.html; el.dataset.act = cfg.act;
  }
}
function render(){
  document.querySelectorAll(".tab").forEach(t => t.removeAttribute("aria-current"));
  $(`.tab[data-tab="${U.tab}"]`).setAttribute("aria-current","page");
  $("#v-eval").hidden = U.tab!=="eval"; $("#v-res").hidden = U.tab!=="res"; $("#v-ex").hidden = U.tab!=="ex";
  $("#scorebar").hidden = U.tab!=="eval";
  const sy = $("#sync"); sy.classList.toggle("local", mode!=="cloud");
  sy.querySelector("span").textContent = mode==="cloud" ? "Gesynchroniseerd op al je toestellen" : mode==="local" ? "Bewaard op dit toestel" : "Laden…";
  sy.hidden = U.tab==="ex" && !!U.editing;
  if (U.tab==="eval") renderEval(); else if (U.tab==="res") renderRes(); else renderEx();
}

/* ---------- beoordelen ---------- */
function renderEval(){
  const v = $("#v-eval"); const ex = curEx();
  setNav("Beoordelen", null, ex ? {html:"Wis", act:"resetEval"} : null);
  if (!ex) {
    v.innerHTML = `<div class="gap"></div><div class="group empty"><h2>${mode==="loading"?"Laden…":"Nog geen oefeningen"}</h2>
      <p>Maak eerst een oefening met criteria aan. Daarna beoordeel je hier je leerlingen.</p>
      ${mode==="loading"?"":`<button class="btn" data-act="newEx">Oefening toevoegen</button>`}</div>`;
    updateScore(); return;
  }
  const keepFocus = document.activeElement?.id;
  v.innerHTML = `
    <div class="gh">Oefening</div>
    <div class="group"><button class="cell" data-act="pickExSheet"><span style="font-weight:600">${esc(ex.name)}</span><span class="val">${ex.criteria.length} criteria</span>${CHEV}</button></div>
    <div class="gh">Leerling</div>
    <div class="group">
      <label class="cell"><span class="cell-l">Naam</span><input id="nameIn" autocomplete="off" autocorrect="off" autocapitalize="words" enterkeyhint="done" placeholder="Voor- en achternaam" value="${esc(U.name)}"></label>
      <div class="sugg" id="sugg" hidden></div>
      <label class="cell"><span class="cell-l">Klas</span><input id="klasIn" autocomplete="off" autocorrect="off" autocapitalize="characters" enterkeyhint="done" placeholder="bv. GR1" value="${esc(U.klas)}"></label>
      <div class="cell" id="exist" hidden></div>
    </div>
    <div class="segctl" role="group" aria-label="Weergave" style="margin-top:20px">
      <button data-act="compact" data-v="0" aria-pressed="${!U.compact}">Met omschrijving</button>
      <button data-act="compact" data-v="1" aria-pressed="${U.compact}">Snel aanduiden</button>
    </div>
    ${ex.criteria.map((c,i)=>{
      const sel = U.choices[c.id];
      return `<div class="gh" id="h_${c.id}"><span>${i+1}. ${esc(c.name)}</span><span class="got ${sel!=null?"ok":""}">${sel!=null?fmt(c.levels[sel].points)+" / ":""}${fmt(critMax(c))} p.</span></div>
      ${U.compact
        ? `<div class="group segs">${c.levels.map((l,li)=>`<button class="seg-o" data-l="${li}" data-act="choose" data-c="${c.id}" data-li="${li}" aria-pressed="${sel===li}"><span class="n">${LEVELS[li]}</span><span class="p">${fmt(l.points)}</span></button>`).join("")}</div>`
        : `<div class="group">${c.levels.map((l,li)=>`<button class="cell opt" data-l="${li}" data-act="choose" data-c="${c.id}" data-li="${li}" aria-pressed="${sel===li}">
            <span class="dot"></span><span class="opt-b"><span class="opt-n">${LEVELS[li]}</span>${l.desc?`<span class="opt-d">${esc(l.desc)}</span>`:""}</span>
            <span class="opt-p">${fmt(l.points)} p.</span>${CHECK}</button>`).join("")}</div>`}`;}).join("")}
    <div class="gf">Tik een niveau opnieuw aan om het te wissen.</div>`;
  if (keepFocus==="nameIn"||keepFocus==="klasIn") { const el=$("#"+keepFocus); el.focus({preventScroll:true}); }
  updateEvalMeta();
}
function updateEvalMeta(){
  const ex = curEx(); if (!ex || !$("#nameIn")) { updateScore(); return; }
  // suggestions
  const q = U.name.trim().toLowerCase(), sg = $("#sugg");
  const hits = q ? Object.values(S.students).filter(s => s.name.toLowerCase().includes(q) && s.name.toLowerCase()!==q).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,8) : [];
  sg.hidden = !hits.length || document.activeElement?.id!=="nameIn";
  sg.innerHTML = hits.map(s=>`<button data-act="pickName" data-n="${esc(s.name)}">${esc(s.name)}${s.klas?` <span style="color:var(--ink2)">· ${esc(s.klas)}</span>`:""}</button>`).join("");
  // existing score
  const st = findStudent(U.name), ex2 = st && S.scores[scoreId(st[0], ex.id)], el = $("#exist");
  el.hidden = !ex2;
  if (ex2) el.innerHTML = `<div class="notice"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 6v5M10 14v.01"/></svg><span>Heeft al <b>${fmt(ex2.total)}/${fmt(ex2.max)}</b> voor deze oefening. Opslaan vervangt die score.</span></div>`;
  updateScore();
}
function updateScore(){
  const ex = curEx();
  if (!ex) { $("#scoreBig").innerHTML = `– <small></small>`; $("#scoreSub").textContent = "Nog geen oefening"; $("#saveBtn").disabled = true; return; }
  const max = maxOf(ex); let tot = 0, done = 0;
  ex.criteria.forEach(c => { const s = U.choices[c.id]; if (s!=null) { tot += +c.levels[s].points; done++; } });
  const pct = max ? tot/max : 0, fg = $("#ringfg");
  $("#scoreBig").innerHTML = `${fmt(tot)} <small>/ ${fmt(max)}</small>`;
  fg.style.strokeDashoffset = 119.38*(1-pct); fg.style.stroke = done ? lvlColor(pct) : "transparent";
  const all = done===ex.criteria.length, named = U.name.trim().length>0;
  $("#scoreSub").textContent = !all ? `${done} van ${ex.criteria.length} criteria${named?"":" · naam ontbreekt"}` : !named ? "Vul nog een naam in" : `${Math.round(pct*100)}% · klaar om op te slaan`;
  $("#saveBtn").disabled = !(all && named);
}
async function saveEval(){
  const ex = curEx(); if (!ex) return;
  const name = U.name.trim().replace(/\s+/g," "); if (!name) return;
  const klas = U.klas.trim(); let st = findStudent(name), sid;
  $("#saveBtn").disabled = true;
  try {
    if (st) { sid = st[0]; if (klas && st[1].klas !== klas) await put("students", sid, {...st[1], klas}); }
    else { sid = slug(name)+"-"+Math.random().toString(36).slice(2,6); await put("students", sid, {name, klas, createdAt:new Date().toISOString()}); }
    const detail = ex.criteria.map(c => ({ criterion:c.name, level:LEVELS[U.choices[c.id]], levelIndex:U.choices[c.id], points:+c.levels[U.choices[c.id]].points, max:critMax(c) }));
    const total = detail.reduce((s,d)=>s+d.points,0), max = maxOf(ex);
    const choices = {}; ex.criteria.forEach(c=>choices[c.id]=U.choices[c.id]);
    await put("scores", scoreId(sid, ex.id), { studentId:sid, studentName:name, klas, exerciseId:ex.id, exerciseName:ex.name, choices, detail, total, max, date:new Date().toISOString() });
    toast(`✓ ${name} · ${fmt(total)}/${fmt(max)}`);
    U.name = ""; U.choices = {}; render(); window.scrollTo({top:0,behavior:"smooth"});
  } catch { toast("Opslaan mislukt. Probeer opnieuw."); updateScore(); }
}

/* ---------- resultaten ---------- */

  if (!scores.length) { v.innerHTML = `<div class="gap"></div><div class="group empty"><h2>Nog geen resultaten</h2><p>Beoordeel een leerling en de score verschijnt hier.</p><button class="btn" data-tab="eval">Start met beoordelen</button></div>`; return; }

    body = `
      <div class="gh">Oefening</div>

          <div class="stat"><b>${rows.length?fmt(avg):"–"}</b><span>gemiddeld / ${fmt(max)}</span></div>
          <div class="stat"><b>${rows.length?Math.round(avg/max*100)+"%":"–"}</b><span>gemiddeld %</span></div>
        </div></div>
      <div class="gh"><span>Leerlingen</span><button class="tintc" style="text-transform:none;font-size:13px" data-act="sort">${U.resSort==="name"?"Sorteer op score":"Sorteer op naam"}</button></div>
      ${rows.length ? `<div class="group">${rows.map(r=>{ const p=r.max?r.total/r.max:0; const d=new Date(r.date);

          <span class="badge" style="--c:${lvlColor(p)}">${fmt(r.total)}<small>/${fmt(r.max)}</small></span>${CHEV}</button>`;}).join("")}</div>`
        : `<div class="group empty"><p>Nog niemand beoordeeld voor deze oefening.</p><button class="btn" data-act="goEval" data-id="${U.resEx}">Beoordeel</button></div>`}`;
  } else {
    const by = {};
    scores.forEach(s => { (by[s.studentId] ||= { name:S.students[s.studentId]?.name || s.studentName, klas:S.students[s.studentId]?.klas || s.klas, list:[] }).list.push(s); });
    const list = Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));
    body = `<div class="gh">${list.length} leerlingen</div><div class="group">${list.map(st=>{
      const tot=st.list.reduce((s,x)=>s+x.total,0), mx=st.list.reduce((s,x)=>s+x.max,0), p=mx?tot/mx:0;
      return `<div class="cell"><span class="row-m"><span class="row-t">${esc(st.name)}</span><span class="row-s">${esc(st.klas||"")}${st.klas?" · ":""}${st.list.length} oefening${st.list.length===1?"":"en"}</span>
        <span class="tags">${st.list.map(x=>`<span class="tag">${esc(x.exerciseName)} <b>${fmt(x.total)}/${fmt(x.max)}</b></span>`).join("")}</span></span>

  }
  v.innerHTML = `<div class="segctl" role="group">
      <button data-act="resMode" data-v="ex" aria-pressed="${U.resMode==="ex"}">Per oefening</button>

      <button class="cell ind" data-act="csv"><span class="icon-c" style="background:var(--l0)">${ICON_DOC}</span><span class="row-m"><span class="row-t">Exporteer CSV</span><span class="row-s">Deze oefening, voor Excel</span></span>${CHEV}</button>

}

function autosize(t){ t.style.height="auto"; t.style.height=t.scrollHeight+"px"; }

/* ---------- sheets ---------- */
function openSheet(html){
  const s=$("#sheet"), b=$("#sheetBd"); $("#sheetC").innerHTML=html; s.hidden=false; b.hidden=false; s.scrollTop=0;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ s.classList.add("open"); b.classList.add("open"); }));
}
function closeSheet(){
  const s=$("#sheet"), b=$("#sheetBd"); s.classList.remove("open"); b.classList.remove("open");
  setTimeout(()=>{ if(!s.classList.contains("open")){ s.hidden=true; b.hidden=true; } }, 320);
}
function confirmSheet(title, msg, label, act, id){
  openSheet(`<div class="group" style="text-align:center"><div class="cell" style="flex-direction:column;gap:4px;padding:16px"><b style="font-size:15px">${esc(title)}</b><span style="font-size:13px;color:var(--ink2)">${esc(msg)}</span></div>
    <button class="cell center dangerc" style="font-weight:600" data-act="${act}" data-id="${id}">${esc(label)}</button></div>
    <div class="gap"></div><button class="btn plain wide" style="background:var(--sheet-card);font-weight:600" data-act="closeSheet">Annuleer</button>`);
}
function pickSheet(act, current){
  openSheet(`<div class="sheet-h"><h2>Kies een oefening</h2></div><div class="group">${exList().map(e=>`<button class="cell opt" data-act="${act}" data-id="${e.id}" aria-pressed="${e.id===current}"><span class="row-m"><span class="row-t">${esc(e.name)}</span><span class="row-s">${e.criteria.length} criteria · max. ${fmt(maxOf(e))} p.</span></span>${CHECK}</button>`).join("")}</div>
    <div class="gap"></div><div class="group"><button class="cell tintc" data-act="newEx">Nieuwe oefening</button></div>`);
}

/* ---------- export / import ---------- */
async function offerFile(filename, data, okMsg){
  const type = filename.endsWith(".pdf") ? "application/pdf" : filename.endsWith(".csv") ? "text/csv" : "application/json";
  const blob = data instanceof Blob ? new Blob([data], {type}) : new Blob([data], {type});
  try {
    const file = new File([blob], filename, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file]}); if (okMsg) toast(okMsg); return true; }
  } catch (e) { if (e?.name === "AbortError") return false; }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); if (okMsg) toast(okMsg); return true;
  } catch { toast("Bestand kon niet bewaard worden."); return false; }
}
function csv(){
  const ex = exList().find(e=>e.id===U.resEx); if (!ex) return;
  const rows = scoreList().filter(s=>s.exerciseId===ex.id).sort((a,b)=>a.studentName.localeCompare(b.studentName));
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const head = ["Leerling","Klas",...ex.criteria.map(c=>c.name),"Totaal","Max"].map(q).join(";");
  const lines = rows.map(r=>[q(r.studentName),q(r.klas),...ex.criteria.map((c,i)=>q(fmt(r.detail?.[i]?.points ?? ""))),q(fmt(r.total)),q(fmt(r.max))].join(";"));
  offerFile(`${slug(ex.name)}-scores-${stamp()}.csv`, "﻿"+[head,...lines].join("\n"), "CSV bewaard");
}
function exportJson(){
  const txt = JSON.stringify({ app:"LO Scorekaart", version:1, exportedAt:new Date().toISOString(), ...S }, null, 2);
  { offerFile(`lo-beoordelingen-${stamp()}.json`, txt, "JSON bewaard"); return; }
  openSheet(`<div class="sheet-h"><div><h2>JSON-export</h2><p>Kopieer en bewaar deze tekst.</p></div></div><textarea class="json-out" id="jsonOut" readonly>${esc(txt)}</textarea><div class="gap"></div><button class="btn wide" data-act="copyJson">Kopieer</button>`);
}
async function importJson(file){
  try {
    const d = JSON.parse(await file.text()); let n = 0;
    for (const col of ["exercises","students","scores"]) for (const [id,obj] of Object.entries(d[col]||{})) if (obj && typeof obj==="object") { await put(col,id,obj); n++; }
    toast(n ? `${n} items geïmporteerd` : "Geen gegevens gevonden");
  } catch { toast("Dit is geen geldige JSON-export."); }
}

/* ---------- PDF ---------- */
async function makePdf(){
  if (!window.jspdf?.jsPDF) { toast("PDF-module kon niet laden."); return; }
  const scores = scoreList(); if (!scores.length) { toast("Nog geen resultaten om te bewaren."); return; }
  toast("PDF wordt gemaakt…");
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });
  const W=210, H=297, M=14, CW=W-2*M;
  const INK=[17,17,20], MUTED=[110,110,118], LINE=[222,222,228], TINT=[0,122,255];
  const LV=[[40,177,76],[0,179,170],[240,140,0],[255,59,48]];
  const tint = (c,a=.18) => c.map(v=>Math.round(255-(255-v)*a));
  const pctCol = p => p>=.8?LV[0]:p>=.65?LV[1]:p>=.5?LV[2]:LV[3];
  const now = new Date(); const today = now.toLocaleDateString("nl-BE",{day:"numeric",month:"long",year:"numeric"}) + " om " + now.toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  const fit = (t,w) => { t=String(t??""); if (doc.getTextWidth(t)<=w) return t; while (t.length && doc.getTextWidth(t+"…")>w) t=t.slice(0,-1); return t+"…"; };
  let y = M;
  const setF = (size, style="normal", col=INK) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...col); };
  const newPage = () => { doc.addPage(); y = M+4; };
  const need = h => { if (y + h > H - 16) { newPage(); return true; } return false; };

  // cover band
  doc.setFillColor(...INK); doc.rect(0,0,W,46,"F");
  setF(9,"bold",[170,170,180]); doc.text("LICHAMELIJKE OPVOEDING", M, 16);
  setF(24,"bold",[255,255,255]); doc.text("Overzicht resultaten", M, 28);
  setF(10,"normal",[200,200,208]); doc.text(today, M, 37);
  const exs = exList().filter(e => scores.some(s=>s.exerciseId===e.id));
  const nStu = new Set(scores.map(s=>s.studentId)).size;
  const kp = [[String(nStu),"leerlingen"],[String(exs.length),"oefeningen"],[String(scores.length),"beoordelingen"]];
  kp.forEach(([b,l],i)=>{ const x = W-M-i*30; setF(18,"bold",[255,255,255]); doc.text(b, x, 28, {align:"right"}); setF(8,"normal",[170,170,180]); doc.text(l, x, 34, {align:"right"}); });
  y = 58;

  // legend
  setF(8,"normal",MUTED); let lx = M;
  LEVELS.forEach((l,i)=>{ doc.setFillColor(...LV[i]); doc.circle(lx+1.5, y-1.1, 1.5, "F"); doc.text(l, lx+4.5, y); lx += doc.getTextWidth(l)+11; });
  y += 8;

  const tableHeader = (cols) => {
    doc.setFillColor(244,244,247); doc.roundedRect(M, y, CW, 8, 1.5, 1.5, "F");
    setF(7.5,"bold",MUTED);
    cols.forEach(c => doc.text(c.t, c.align==="right"?c.x+c.w-2:c.align==="center"?c.x+c.w/2:c.x+2, y+5.3, {align:c.align||"left"}));
    y += 8;
  };

  for (const ex of exs) {
    const rows = scores.filter(s=>s.exerciseId===ex.id).sort((a,b)=>a.studentName.localeCompare(b.studentName));
    const max = maxOf(ex), avg = rows.reduce((s,r)=>s+r.total,0)/rows.length;
    // criteria legend lines
    setF(8,"normal",MUTED);
    const legend = doc.splitTextToSize(ex.criteria.map((c,i)=>`${i+1}. ${c.name} (${fmt(critMax(c))})`).join("   ·   "), CW);
    need(24 + legend.length*3.6 + 8*Math.min(rows.length,3));
    setF(15,"bold",INK); doc.text(ex.name, M, y+5);
    setF(9,"normal",MUTED); doc.text(`${rows.length} leerling${rows.length===1?"":"en"}  ·  gemiddeld ${fmt(avg)}/${fmt(max)} (${Math.round(avg/max*100)}%)`, W-M, y+5, {align:"right"});
    y += 10; setF(8,"normal",MUTED); doc.text(legend, M, y); y += legend.length*3.6 + 2;

    const k = ex.criteria.length, wName = 52, wKlas = 16, wTot = 22, wPct = 14;
    const wC = (CW - wName - wKlas - wTot - wPct) / k;
    const cols = [{t:"LEERLING",x:M,w:wName},{t:"KLAS",x:M+wName,w:wKlas}];
    ex.criteria.forEach((c,i)=>cols.push({t:String(i+1),x:M+wName+wKlas+i*wC,w:wC,align:"center"}));
    cols.push({t:"TOTAAL",x:M+wName+wKlas+k*wC,w:wTot,align:"right"},{t:"%",x:M+wName+wKlas+k*wC+wTot,w:wPct,align:"right"});
    tableHeader(cols);
    rows.forEach((r,ri) => {
      const rh = 7.4;
      if (need(rh)) tableHeader(cols);
      setF(9.5,"normal",INK); doc.text(fit(r.studentName, wName-4), M+2, y+4.9);
      setF(8.5,"normal",MUTED); doc.text(fit(r.klas||"", wKlas-3), M+wName+2, y+4.9);
      ex.criteria.forEach((c,i) => {
        const d = (r.detail||[])[i]; if (!d) return;
        const cx = M+wName+wKlas+i*wC, bw = Math.min(wC-2, 13);
        doc.setFillColor(...tint(LV[d.levelIndex]||LINE, .2)); doc.roundedRect(cx+(wC-bw)/2, y+1.2, bw, 5, 1.2, 1.2, "F");
        setF(8.5,"bold",INK); doc.text(fmt(d.points), cx+wC/2, y+4.8, {align:"center"});
      });
      const tx = M+wName+wKlas+k*wC, p = r.max ? r.total/r.max : 0;
      setF(10,"bold",INK); doc.text(`${fmt(r.total)}`, tx+wTot-9, y+4.9, {align:"right"});
      setF(8,"normal",MUTED); doc.text(`/${fmt(r.max)}`, tx+wTot-2, y+4.9, {align:"right"});
      setF(9,"bold",pctCol(p)); doc.text(`${Math.round(p*100)}%`, tx+wTot+wPct-2, y+4.9, {align:"right"});
      y += rh; doc.setDrawColor(...LINE); doc.setLineWidth(.2); if (ri<rows.length-1) doc.line(M, y, W-M, y);
    });
    y += 10;
  }

  // per student overview
  if (exs.length) {
    newPage();
    setF(15,"bold",INK); doc.text("Overzicht per leerling", M, y+5); y += 11;
    const by = {};
    scores.forEach(s => { (by[s.studentId] ||= { name:S.students[s.studentId]?.name || s.studentName, klas:S.students[s.studentId]?.klas || s.klas || "", m:{} }).m[s.exerciseId] = s; });
    const list = Object.values(by).sort((a,b)=>a.name.localeCompare(b.name));
    const wName = 50, wKlas = 16, wTot = 20, wE = (CW-wName-wKlas-wTot)/exs.length;
    const cols = [{t:"LEERLING",x:M,w:wName},{t:"KLAS",x:M+wName,w:wKlas}];
    setF(7.5,"bold",MUTED);
    exs.forEach((e,i)=>cols.push({t:fit(e.name.toUpperCase(), wE-3),x:M+wName+wKlas+i*wE,w:wE,align:"center"}));
    cols.push({t:"GEMIDDELD",x:W-M-wTot,w:wTot,align:"right"});
    tableHeader(cols);
    list.forEach((st,ri) => {
      const rh = 7.4; if (need(rh)) tableHeader(cols);
      setF(9.5,"normal",INK); doc.text(fit(st.name, wName-4), M+2, y+4.9);
      setF(8.5,"normal",MUTED); doc.text(fit(st.klas, wKlas-3), M+wName+2, y+4.9);
      let tot=0, mx=0;
      exs.forEach((e,i)=>{ const s = st.m[e.id], cx = M+wName+wKlas+i*wE;
        if (!s) { setF(9,"normal",LINE); doc.text("-", cx+wE/2, y+4.9, {align:"center"}); return; }
        tot+=s.total; mx+=s.max; setF(9,"normal",INK); doc.text(`${fmt(s.total)}/${fmt(s.max)}`, cx+wE/2, y+4.9, {align:"center"}); });
      const p = mx ? tot/mx : 0; setF(9.5,"bold",pctCol(p)); doc.text(`${Math.round(p*100)}%`, W-M-2, y+4.9, {align:"right"});
      y += rh; doc.setDrawColor(...LINE); doc.setLineWidth(.2); if (ri<list.length-1) doc.line(M, y, W-M, y);
    });
  }

  // footers
  const n = doc.getNumberOfPages();
  for (let i=1;i<=n;i++){ doc.setPage(i); setF(7.5,"normal",MUTED); doc.text(`LO Scorekaart · ${today}`, M, H-8); doc.text(`${i} / ${n}`, W-M, H-8, {align:"right"}); }
  await offerFile(`LO-resultaten-${stamp()}.pdf`, doc.output("blob"), "PDF bewaard");
}

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-act],[data-tab]"); if (!t) return;
  if (t.dataset.tab) { closeSheet(); U.tab = t.dataset.tab; if (U.tab!=="ex") U.editing=null; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "pickExSheet": pickSheet("pickEx", U.exId); break;
    case "pickEx": if (U.exId!==id){ U.exId=id; U.choices={}; ls.set("lo-ex",id);} closeSheet(); render(); break;
    case "pickResSheet": pickSheet("pickRes", U.resEx); break;
    case "pickRes": U.resEx=id; closeSheet(); render(); break;
    case "pickName": { U.name=t.dataset.n; const s=findStudent(U.name); if (s?.[1].klas) { U.klas=s[1].klas; } $("#nameIn").value=U.name; $("#klasIn").value=U.klas; $("#nameIn").blur(); updateEvalMeta(); break; }
    case "choose": {
      const c=t.dataset.c, li=+t.dataset.li, first = U.choices[c]==null;
      if (U.choices[c]===li) delete U.choices[c]; else U.choices[c]=li;
      const y0 = window.scrollY; renderEval(); window.scrollTo(0,y0);
      if (first && U.choices[c]!=null) {
        const ex=curEx(), idx=ex.criteria.findIndex(x=>x.id===c), next=ex.criteria.slice(idx+1).find(x=>U.choices[x.id]==null);
        if (next) setTimeout(()=>document.getElementById("h_"+next.id)?.scrollIntoView({behavior:"smooth",block:"start"}),120);
      }
      break; }
    case "compact": U.compact = t.dataset.v==="1"; ls.set("lo-compact",U.compact); renderEval(); break;
    case "resetEval": U.choices={}; U.name=""; renderEval(); window.scrollTo({top:0,behavior:"smooth"}); break;
    case "goEval": closeSheet(); U.tab="eval"; U.exId=id; U.choices={}; ls.set("lo-ex",id); render(); window.scrollTo(0,0); break;
    case "resMode": U.resMode=t.dataset.v; render(); break;
    case "sort": U.resSort = U.resSort==="name"?"score":"name"; render(); break;
    case "openScore": scoreSheet(id); break;
    case "askDelScore": { const r=S.scores[id]; confirmSheet("Score verwijderen?", `${r?.studentName} · ${r?.exerciseName}`, "Verwijder score", "delScore", id); break; }
    case "delScore": closeSheet(); await del("scores",id); toast("Score verwijderd"); break;
    case "editScore": { const s=S.scores[id]; if(!s) break; closeSheet(); U.tab="eval"; U.exId=s.exerciseId; U.name=S.students[s.studentId]?.name||s.studentName; U.klas=s.klas||U.klas; U.choices={...(s.choices||{})}; render(); window.scrollTo(0,0); break; }
    case "exSheet": { const e=S.exercises[id]; if(!e) break; const n=Object.values(S.scores).filter(s=>s.exerciseId===id).length;
      openSheet(`<div class="sheet-h"><div><h2>${esc(e.name)}</h2><p>${e.criteria.length} criteria · max. ${fmt(maxOf(e))} p. · ${n} beoordeeld</p></div></div>
        <div class="group"><button class="cell tintc" data-act="goEval" data-id="${id}">Beoordeel leerlingen</button><button class="cell tintc" data-act="editEx" data-id="${id}">Bewerk criteria</button>
        <button class="cell dangerc" data-act="askDelEx" data-id="${id}">Verwijder oefening</button></div>
        <div class="gap"></div><button class="btn plain wide" style="background:var(--sheet-card)" data-act="closeSheet">Sluit</button>`); break; }
    case "askDelEx": { const n=Object.values(S.scores).filter(s=>s.exerciseId===id).length; confirmSheet("Oefening verwijderen?", n?`Ook ${n} score${n===1?"":"s"} worden verwijderd.`:"Er zijn nog geen scores.", "Verwijder oefening", "delEx", id); break; }
    case "delEx": closeSheet(); for (const [sid,s] of Object.entries(S.scores)) if (s.exerciseId===id) await del("scores",sid); await del("exercises",id); toast("Oefening verwijderd"); break;
    case "newEx": closeSheet(); U.tab="ex"; U.editing={id:null,name:"",criteria:[blankCrit(0)]}; render(); window.scrollTo(0,0); break;
    case "editEx": closeSheet(); U.tab="ex"; U.editing=JSON.parse(JSON.stringify({id,...S.exercises[id]})); render(); window.scrollTo(0,0); break;
    case "addCrit": U.editing.criteria.push(blankCrit(U.editing.criteria.length)); render(); setTimeout(()=>$("#cn"+(U.editing.criteria.length-1))?.focus(),50); break;
    case "rmCrit": U.editing.criteria.splice(+t.dataset.i,1); render(); break;
    case "cancelEx": U.editing=null; render(); window.scrollTo(0,0); break;
    case "saveEx": {
      const e=U.editing; e.name=e.name.trim();
      if (!e.name) { toast("Geef de oefening een naam."); $("#exName")?.focus(); break; }
      const crit=e.criteria.filter(c=>c.name.trim()).map(c=>({id:c.id,name:c.name.trim(),levels:c.levels.map(l=>({points:Math.max(0,parseFloat(String(l.points).replace(",","."))||0),desc:(l.desc||"").trim()}))}));
      if (!crit.length) { toast("Geef minstens één criterium een naam."); break; }
      const newId = e.id || (slug(e.name)+"-"+Math.random().toString(36).slice(2,5)), prev = S.exercises[newId];
      try { await put("exercises", newId, {name:e.name, criteria:crit, createdAt:prev?.createdAt||new Date().toISOString(), updatedAt:new Date().toISOString()});
        U.editing=null; U.exId=newId; ls.set("lo-ex",newId); toast("Oefening bewaard"); render(); window.scrollTo(0,0); }
      catch { toast("Bewaren mislukt. Probeer opnieuw."); }
      break; }
    case "pdf": closeSheet(); makePdf(); break;
    case "csv": csv(); break;
    case "exportJson": exportJson(); break;
    case "importJson": $("#importFile").click(); break;
    case "copyJson": { const ta=$("#jsonOut"); try{ await navigator.clipboard.writeText(ta.value); toast("Gekopieerd"); }catch{ ta.focus(); ta.select(); } break; }
    case "closeSheet": closeSheet(); break;
  }
});
$("#sheetBd").addEventListener("click", closeSheet);
$("#saveBtn").addEventListener("click", saveEval);
$("#importFile").addEventListener("change", e => { const f=e.target.files[0]; if (f) importJson(f); e.target.value=""; });
document.addEventListener("pointerdown", e => { if (e.target.closest("#sugg")) e.preventDefault(); });
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id==="nameIn") { U.name=t.value; const s=findStudent(U.name); if (s?.[1].klas && !U.klas.trim()) { U.klas=s[1].klas; $("#klasIn").value=U.klas; } updateEvalMeta(); return; }
  if (t.id==="klasIn") { U.klas=t.value; ls.set("lo-klas",U.klas); return; }
  if (t.tagName==="TEXTAREA") autosize(t);
  const b = t.dataset.bind; if (!b || !U.editing) return;
  const p = b.split(".");
  if (p[0]==="name") U.editing.name=t.value;
  else if (p[2]==="name") U.editing.criteria[+p[1]].name=t.value;
  else if (p[2]==="l") U.editing.criteria[+p[1]].levels[+p[3]][p[4]] = t.value;
});
document.addEventListener("focusin", e => { if (e.target.id==="nameIn") updateEvalMeta(); });
document.addEventListener("focusout", e => { if (e.target.id==="nameIn") setTimeout(()=>{ const sg=$("#sugg"); if (sg && document.activeElement?.id!=="nameIn") sg.hidden=true; },0); });
document.addEventListener("keydown", ev => { if (ev.key==="Enter" && ev.target.tagName==="INPUT") { ev.preventDefault(); ev.target.blur(); } });
const nav = $("#nav"); const onScroll = () => nav.classList.toggle("solid", window.scrollY > 38);
window.addEventListener("scroll", onScroll, {passive:true});

let tt; function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove("show"),2400); }

render(); onScroll(); initStore();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
